[package]
name = "parry-test-publisher"
description = "Sandbox test helper: publishes global contract code, which near-workspaces cannot do directly."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["global-contracts"] }
