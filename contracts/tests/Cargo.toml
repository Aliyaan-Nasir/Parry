[package]
name = "parry-sandbox-tests"
description = "Sandbox tests of Parry's contracts and cross-contract flows on a local NEAR node, against the real lending, exchange, wNEAR and LiNEAR code."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dev-dependencies]
near-workspaces = { version = "0.24", default-features = false, features = ["install"] }
near-sdk = { workspace = true, features = ["unit-testing", "global-contracts"] }
parry-common = { path = "../common" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = "2"
bs58 = "0.5"
base64 = "0.22"
hex = { workspace = true }
sha2 = "0.10"
