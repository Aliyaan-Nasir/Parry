[package]
name = "parry-account"
description = "A Parry protected account: a NEP-655 universal account owned by a passkey or a NEAR account, with a guardian that can only protect, inside an on-chain mandate."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["global-contracts"] }
parry-common = { path = "../common" }
hex = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing", "global-contracts"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.98.1"
image_digest = "sha256:90cf2abe31d75946d82f1c6eee70802332b4d499ac39c01a5c41f228000ecb8a"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]
