[workspace]
resolver = "2"
members = []

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aliyaan Nasir"]
repository = "https://github.com/Aliyaan-Nasir/Parry"

[workspace.dependencies]
near-sdk = { version = "5.30.1", default-features = false, features = ["wee_alloc"] }
near-contract-standards = "5.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
