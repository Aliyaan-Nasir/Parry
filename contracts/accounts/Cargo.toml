[package]
name = "parry-accounts"
description = "Parry's account factory: derives and creates NEP-655 universal accounts from the published protected-account code, paid by a relayer so people need no NEAR."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["global-contracts", "universal-accounts"] }
parry-common = { path = "../common" }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing", "global-contracts", "universal-accounts"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.98.1"
image_digest = "sha256:90cf2abe31d75946d82f1c6eee70802332b4d499ac39c01a5c41f228000ecb8a"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]
