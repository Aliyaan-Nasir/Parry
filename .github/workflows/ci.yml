# Every check AGENTS.md lists under "Commands", on each push to main and each pull request.
# Actions are pinned to full commit SHAs (the comment names the release).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"
  # The runtime of the services image (deploy/Dockerfile), so tests run on what production runs.
  BUN_VERSION: "1.3.1"

defaults:
  run:
    shell: bash

jobs:
  typescript:
    name: Typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (pnpm from package.json "packageManager")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      # Dependents resolve @parry/core, @parry/sdk and @parry/mcp types from their dist folders.
      - name: Build the workspace packages
        run: pnpm --filter "./packages/*" build
      - run: pnpm typecheck
      - run: pnpm typecheck:scripts
      - run: pnpm lint
      - name: The README's generated blocks and the docs' line anchors are current
        run: bun scripts/readme.ts --check

  test:
    name: TypeScript tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: parry
          POSTGRES_PASSWORD: parry
          POSTGRES_DB: parry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://parry:parry@localhost:5432/parry_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Build the workspace packages
        run: pnpm --filter "./packages/*" build
      - run: pnpm test

  web:
    name: Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_PARRY_NETWORK: testnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site and every workspace package it depends on, in dependency order.
      - run: pnpm --filter "@parry/web..." build

  contracts:
    name: Contract unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain in contracts/rust-toolchain.toml
        working-directory: contracts
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - working-directory: contracts
        run: cargo test --workspace --exclude parry-sandbox-tests

  enclave:
    name: Enclave tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain in enclave/rust-toolchain.toml
        working-directory: enclave
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: enclave -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - working-directory: enclave
        run: cargo test --locked

  sandbox:
    name: Sandbox tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain in contracts/rust-toolchain.toml
        working-directory: contracts
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The release binary, pinned by checksum: building cargo-near from source needs libudev.
      - name: Install cargo-near 0.22.0
        run: |
          f=cargo-near-x86_64-unknown-linux-gnu
          curl -fsSLO "https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/$f.tar.gz"
          echo "9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a  $f.tar.gz" | sha256sum -c -
          tar xzf "$f.tar.gz" && install -m 755 "$f/cargo-near" ~/.cargo/bin/ && rm -rf "$f" "$f.tar.gz"
          cargo near --version
      # Third-party contract code read from public RPC and checked against pinned hashes.
      - run: contracts/scripts/fetch-fixtures.sh
      - run: contracts/scripts/build.sh
      - working-directory: contracts
        run: cargo test -p parry-sandbox-tests

  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install the pinned Rust toolchains
        run: |
          (cd contracts && rustup toolchain install)
          (cd enclave && rustup toolchain install)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            contracts -> target
            enclave -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      # Clippy on both Rust trees, cargo audit, cargo deny and pnpm audit (scripts/security.ts).
      - run: pnpm security
